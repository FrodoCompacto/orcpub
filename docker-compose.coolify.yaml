services:
  orcpub:
    image: orcpub-app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    environment:
      PORT: ${PORT:-8890}
      TZ: ${TZ:-America/Sao_Paulo}
      EMAIL_SERVER_URL: ${EMAIL_SERVER_URL:-}
      EMAIL_ACCESS_KEY: ${EMAIL_ACCESS_KEY:-}
      EMAIL_SECRET_KEY: ${EMAIL_SECRET_KEY:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_ERRORS_TO: ${EMAIL_ERRORS_TO:-}
      EMAIL_SSL: ${EMAIL_SSL:-FALSE}
      EMAIL_TLS: ${EMAIL_TLS:-FALSE}
      DATOMIC_URL: ${DATOMIC_URL:-datomic:dev://datomic:4334/orcpub}
      DATOMIC_PASSWORD: ${DATOMIC_PASSWORD:?Set DATOMIC_PASSWORD in Coolify}
      SIGNATURE: ${SIGNATURE:?Set SIGNATURE in Coolify}
      AUTH_MODE: ${AUTH_MODE:-cloudflare}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?Set CF_ACCESS_TEAM_DOMAIN in Coolify}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?Set CF_ACCESS_AUD in Coolify}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-}
      DEV_AUTH_USERNAME: ${DEV_AUTH_USERNAME:-}
      CSP_POLICY: ${CSP_POLICY:-strict}
      DEV_MODE: ${DEV_MODE:-}
      LOAD_HOMEBREW_URL: ${LOAD_HOMEBREW_URL:-}
    depends_on:
      datomic:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${PORT:-8890}/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: always

  datomic:
    image: orcpub-datomic
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: transactor
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Coolify}
      DATOMIC_PASSWORD: ${DATOMIC_PASSWORD:?Set DATOMIC_PASSWORD in Coolify}
      ALT_HOST: ${ALT_HOST:-127.0.0.1}
      ENCRYPT_CHANNEL: ${ENCRYPT_CHANNEL:-true}
    volumes:
      - /var/lib/frodo/orcpub/data:/data
      - /var/lib/frodo/orcpub/logs:/log
      - /var/lib/frodo/orcpub/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':10EE ' /proc/net/tcp || grep -q ':10EE ' /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: always
